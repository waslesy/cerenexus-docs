<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流式输出模拟 - 20 tok/s (舒适速)</title>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; display: flex; flex-direction: column; align-items: center; padding: 50px; }
    .chat-container { width: 100%; max-width: 600px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #bba14f; min-height: 250px; line-height: 1.8; font-size: 16px; color: #333; }
    .cursor { display: inline-block; width: 8px; height: 1.2em; background-color: #bba14f; vertical-align: middle; margin-left: 2px; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    button { margin-top: 20px; padding: 10px 20px; font-size: 14px; cursor: pointer; border: none; background-color: #333; color: white; border-radius: 6px; transition: 0.2s; }
    button:hover { background-color: #555; }
    .status { margin-top: 10px; font-size: 14px; color: #666; }
</style>
</head>
<body>

    <div class="chat-container">
        <span id="output"></span><span class="cursor" id="cursor"></span>
    </div>
    <div class="status">当前速度: 20 tok/s (约 35 字/秒) - 舒适阅读线</div>
    <button id="playBtn" onclick="startStream()">开始播放 (20 tok/s)</button>

    <script>
        const text = "在雅典卫城的光辉下，伯罗奔尼撒的战船在爱琴海上破浪前行。与此同时，台伯河畔的罗马城正在从一个共和国蜕变为横跨三大洲的庞大帝国。军团的脚步声如同沉闷的雷鸣，回荡在高卢的森林与北非的沙漠之中。元老院的大理石地面上，西塞罗的雄辩依然余音绕梁；而远方的行省里，总督们正有条不紊地丈量着土地，征收着帝国的赋税。这种速度正如一个稳健扩张的帝国，既不显得迟缓拖沓，也不会让人感到仓促不安。法学家们在羊皮纸上从容不迫地记录着《十二铜表法》的衍生条款，公民们在浴场中惬意地探讨着斯多葛学派的哲学。每一句话、每一个字的流露，都如同高架水渠中平稳流淌的清泉，滋润着庞大帝国的文明版图，让人能够以一种从容不迫的节奏，细细品味历史的厚重与理性的光辉。";
        const tokensPerSecond = 20;
        const charsPerToken = 1.75; 
        const msPerChar = 1000 / (tokensPerSecond * charsPerToken); // 约 28ms 出一个字
        let index = 0;
        let timer;

        function startStream() {
            // 点击后将按钮文字改为“重新播放”
            document.getElementById("playBtn").innerText = "重新播放 (20 tok/s)";
            clearTimeout(timer);
            document.getElementById("output").innerText = "";
            document.getElementById("cursor").style.display = "inline-block";
            index = 0;
            type();
        }

        function type() {
            if (index < text.length) {
                document.getElementById("output").innerText += text.charAt(index);
                index++;
                timer = setTimeout(type, msPerChar);
            } else {
                document.getElementById("cursor").style.display = "none";
            }
        }
    </script>

</body>
</html>
